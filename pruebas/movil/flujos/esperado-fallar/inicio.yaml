# SEMILLA: --aves=AV-P:MACHO,AV-M:HEMBRA
# ESPERADO FALLAR (dashboard): Inicio debe contar las 2 aves activas de la nube (hoy lee SQLite local)
# Si pasa, el informe avisa: migrado, quitar etiqueta.
appId: host.exp.exponent
tags:
  - esperado-fallar
  - dashboard
---
- runFlow:
    file: ../lib/entrar.yaml
    env:
      PUERTO_METRO: ${PUERTO_METRO}
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      CRIADERO: ${CRIADERO}
- tapOn:
    point: "10%,96%"
- extendedWaitUntil:
    visible: ".*Aves activas: 2.*"
    timeout: 15000
- takeScreenshot: inicio-resultado
