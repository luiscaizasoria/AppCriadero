# SEMILLA: --jaulas=JX-1
# ESPERADO FALLAR (cuidados-jaula): guardar Alimentacion de una jaula (hoy: FOREIGN KEY, cuidado en SQLite)
# Si pasa, el informe avisa: migrado, quitar etiqueta.
appId: host.exp.exponent
tags:
  - esperado-fallar
  - cuidados-jaula
---
- runFlow:
    file: ../lib/entrar.yaml
    env:
      PUERTO_METRO: ${PUERTO_METRO}
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      CRIADERO: ${CRIADERO}
- tapOn:
    point: "30%,96%"
- tapOn: ".*JX-1.*"
- scrollUntilVisible:
    element: ".*Alimentación"
- tapOn: ".*Alimentación"
- tapOn: ".*Morichillo.*"
- scrollUntilVisible:
    element: ".*Guardar"
- tapOn: ".*Guardar"
- extendedWaitUntil:
    visible: "Alimentación registrada"
    timeout: 15000
- takeScreenshot: alimentacion-resultado
