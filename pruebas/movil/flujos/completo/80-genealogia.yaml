# SEMILLA: --jaulas=JX-1 --aves=AV-P:MACHO:JX-1,AV-M:HEMBRA,AV-H:MACHO::AV-P:AV-M
# GENEALOGIA: el arbol de AV-H muestra al padre AV-P y a la madre AV-M. AV-P y AV-M no son parientes,
# por lo que no debe aparecer aviso de consanguinidad ni de relacion circular.
appId: host.exp.exponent
tags:
  - completo
  - migrado
  - genealogia
---
- runFlow:
    file: ../lib/entrar.yaml
    env:
      PUERTO_METRO: ${PUERTO_METRO}
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      CRIADERO: ${CRIADERO}
- tapOn:
    point: "50%,96%"
- tapOn: ".*AV-H.*"
- scrollUntilVisible:
    element: ".*Genealogía"
- tapOn: ".*Genealogía"
- extendedWaitUntil:
    visible: ".*AV-P.*"
    timeout: 15000
- assertVisible: ".*AV-M.*"
- assertNotVisible: ".*Relación genealógica inválida.*"
- assertNotVisible: ".*Consanguinidad detectada.*"
- takeScreenshot: genealogia-resultado
