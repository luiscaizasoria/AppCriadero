# SEMILLA: --jaulas=JX-1,JX-2 --aves=AV-P:MACHO:JX-1,AV-M:HEMBRA
# AVES: alta con raza, sexo, padre y madre de la nube; datos previos preparados por API (AV-P, AV-M, JX-1, JX-2).
appId: host.exp.exponent
tags:
  - completo
  - migrado
  - aves
---
- runFlow:
    file: ../lib/entrar.yaml
    env:
      PUERTO_METRO: ${PUERTO_METRO}
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      CRIADERO: ${CRIADERO}
- tapOn:
    point: "50%,96%"
- extendedWaitUntil:
    visible: ".*AV-P.*"
    timeout: 20000
- assertVisible: ".*AV-M.*"
- tapOn: ".*Nueva ave.*"
- tapOn: "Ej. K001"
- inputText: "AV-H"
- hideKeyboard
- scrollUntilVisible:
    element: "Padre"
- tapOn: ".*AV-P.*"
- scrollUntilVisible:
    element: ".*AV-M.*"
- tapOn: ".*AV-M.*"
- scrollUntilVisible:
    element: ".*Kikiris"
- tapOn: ".*Kikiris"
- scrollUntilVisible:
    element: ".*Macho"
- tapOn: ".*Macho"
- scrollUntilVisible:
    element: ".*Guardar ave.*"
- takeScreenshot: ave-formulario-completo
- tapOn: ".*Guardar ave.*"
- extendedWaitUntil:
    visible: ".*fue registrada correctamente.*"
    timeout: 20000
- takeScreenshot: ave-creada
# El aviso desaparece solo y a los ~1,5 s la app navega a la ficha (ya no hay botón «Ver ave»).
# El aviso también contiene "AV-H": se espera primero un texto que solo existe en la ficha.
- extendedWaitUntil:
    visible: ".*Información del ave.*"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*AV-H.*"
    timeout: 20000
- takeScreenshot: ave-detalle
