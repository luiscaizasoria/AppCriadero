# SEMILLA: --jaulas=JX-1
# BEBIDA: guardar el cuidado de una jaula y verlo en su historial.
appId: host.exp.exponent
tags:
  - completo
  - migrado
  - cuidados-jaula
---
- runFlow:
    file: ../lib/entrar.yaml
    env:
      PUERTO_METRO: ${PUERTO_METRO}
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      CRIADERO: ${CRIADERO}
- tapOn:
    point: "30%,96%"
- tapOn: ".*JX-1.*"
- scrollUntilVisible:
    element: ".*Bebida"
- tapOn: ".*Bebida"
- tapOn: ".*Agua"
- scrollUntilVisible:
    element: ".*Guardar"
- tapOn: ".*Guardar"
- extendedWaitUntil:
    visible: "Bebida registrada"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Bebida registrada"
    timeout: 10000
- scrollUntilVisible:
    element: ".*Historial"
- tapOn: ".*Historial"
- extendedWaitUntil:
    visible: ".*Bebida: Agua.*"
    timeout: 20000
- takeScreenshot: bebida-historial
