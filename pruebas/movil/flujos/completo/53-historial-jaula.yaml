# SEMILLA: --jaulas=JX-1 --aves=AV-P:MACHO:JX-1
# HISTORIAL DE JAULA: lista los eventos de la jaula (ingreso del ave) desde la nube.
appId: host.exp.exponent
tags:
  - completo
  - migrado
  - cuidados-jaula
---
- runFlow:
    file: ../lib/entrar.yaml
    env:
      PUERTO_METRO: ${PUERTO_METRO}
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      CRIADERO: ${CRIADERO}
- tapOn:
    point: "30%,96%"
- tapOn: ".*JX-1.*"
- scrollUntilVisible:
    element: ".*Historial"
- tapOn: ".*Historial"
- extendedWaitUntil:
    visible: ".*AV-P.*"
    timeout: 15000
- takeScreenshot: historial-jaula-resultado
