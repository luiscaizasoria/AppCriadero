# SEMILLA: --jaulas=JX-1 --aves=AV-NA:MACHO:JX-1
# NAVEGACION (Bloque A, UX): una alerta abre su pantalla DENTRO de la pestana de origen y "atras" vuelve al origen.
# Sin cuidados ni huevos hoy hay alertas de alimentacion, bebida y produccion (como el flujo 99).
# 1) Inicio > alerta "Registrar alimentacion" > atras = Inicio y la barra sigue en Inicio (antes saltaba a Jaulas).
# 2) Mas > Alertas > alerta "Registrar bebida" > flecha de la cabecera = Alertas (antes saltaba a Jaulas).
# La pestana Jaulas queda en su lista (la pantalla no se abrio en su pila). No guarda datos.
# RIESGO: si ya hay huevos o cuidados de hoy no hay alerta; la semilla no los crea.
appId: host.exp.exponent
tags:
  - completo
  - migrado
  - navegacion
---
- runFlow:
    file: ../lib/entrar.yaml
    env:
      PUERTO_METRO: ${PUERTO_METRO}
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      CRIADERO: ${CRIADERO}
# 1) Desde Inicio (C3 UX: la espera usa el titulo de la primera seccion, que aparece con los datos cargados)
- extendedWaitUntil:
    visible: "Tus aves registradas"
    timeout: 25000
- scrollUntilVisible:
    element: ".*Registrar alimentación.*"
- tapOn: ".*Registrar alimentación.*"
- scrollUntilVisible:
    element: ".*Guardar"
- takeScreenshot: nav-inicio-alimentacion
- back
- extendedWaitUntil:
    visible: "Tus aves registradas"
    timeout: 20000
- assertNotVisible: ".*Guardar"
# La pestana Jaulas sigue en su lista
- tapOn:
    id: "tab-jaulas"
- extendedWaitUntil:
    visible: ".*Nueva jaula.*"
    timeout: 20000
- assertNotVisible: "Alimentación"
# 2) Desde Alertas (Mas)
- tapOn:
    id: "tab-mas"
- extendedWaitUntil:
    visible: "Compradores e historial de ventas por celular"
    timeout: 20000
- tapOn: "Alertas"
- extendedWaitUntil:
    visible: "Alertas pendientes"
    timeout: 25000
- scrollUntilVisible:
    element: ".*Registrar bebida.*"
- tapOn: ".*Registrar bebida.*"
- scrollUntilVisible:
    element: ".*Guardar"
- takeScreenshot: nav-alertas-bebida
- tapOn:
    text: "Volver"
- extendedWaitUntil:
    visible: "Alertas pendientes"
    timeout: 20000
- assertNotVisible: ".*Guardar"
- takeScreenshot: nav-alertas-vuelta
# 3) C3 UX: los accesos de Inicio abren Alertas y Nuevo movimiento DENTRO de la pila de Inicio; la flecha vuelve a Inicio
- tapOn:
    id: "tab-inicio"
- extendedWaitUntil:
    visible: "Tus aves registradas"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "acceso-alertas"
- tapOn:
    id: "acceso-alertas"
- extendedWaitUntil:
    visible: "Alertas pendientes"
    timeout: 25000
- tapOn:
    text: "Volver"
- extendedWaitUntil:
    visible: "Tus aves registradas"
    timeout: 20000
- assertNotVisible: "Alertas pendientes"
- scrollUntilVisible:
    element:
      id: "acceso-nuevo-movimiento"
- tapOn:
    id: "acceso-nuevo-movimiento"
- extendedWaitUntil:
    visible: ".*Guardar movimiento.*"
    timeout: 15000
- tapOn:
    text: "Volver"
- extendedWaitUntil:
    visible: "Tus aves registradas"
    timeout: 20000
- assertNotVisible: ".*Guardar movimiento.*"
- takeScreenshot: nav-inicio-accesos-vuelta
