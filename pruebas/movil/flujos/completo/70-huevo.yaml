# SEMILLA: --jaulas=JX-1 --aves=AV-P:MACHO:JX-1
# HUEVOS: registrar un huevo de un ave; el código H000001 aparece en la lista de huevos del ave.
appId: host.exp.exponent
tags:
  - completo
  - migrado
  - huevos
---
- runFlow:
    file: ../lib/entrar.yaml
    env:
      PUERTO_METRO: ${PUERTO_METRO}
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      CRIADERO: ${CRIADERO}
- tapOn:
    point: "50%,96%"
- tapOn: ".*AV-P.*"
- scrollUntilVisible:
    element: ".*Registrar huevo"
- tapOn: ".*Registrar huevo"
- extendedWaitUntil:
    visible:
      id: "guardar-huevo"
    timeout: 20000
# El botón de guardar se toca por testID (el título y el botón comparten texto).
- tapOn:
    id: "guardar-huevo"
- extendedWaitUntil:
    visible: "Huevo registrado"
    timeout: 15000
- assertVisible: ".*H000001.*"
# C5: «Huevo registrado» es un aviso (sin «Aceptar»); a los 1,8 s vuelve solo a la ficha.
- extendedWaitUntil:
    notVisible: "Huevo registrado"
    timeout: 15000
- scrollUntilVisible:
    element: ".*Huevos registrados.*"
- scrollUntilVisible:
    element: "H000001"
- assertVisible: "H000001"
- assertNotVisible: ".*No existen huevos registrados.*"
- takeScreenshot: huevo-resultado
