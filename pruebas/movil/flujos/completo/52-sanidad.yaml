# SEMILLA: --jaulas=JX-1
# SANIDAD: registrar Fumigacion con detalle; la jaula cambia de estado sanitario y el historial lo muestra.
appId: host.exp.exponent
tags:
  - completo
  - migrado
  - cuidados-jaula
---
- runFlow:
    file: ../lib/entrar.yaml
    env:
      PUERTO_METRO: ${PUERTO_METRO}
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      CRIADERO: ${CRIADERO}
- tapOn:
    point: "30%,96%"
- tapOn: ".*JX-1.*"
- scrollUntilVisible:
    element: ".*Sanidad"
- tapOn: ".*Sanidad"
- tapOn: ".*Fumigación.*"
- tapOn: ".*Detalle de la actividad sanitaria.*"
- inputText: "Se aplico producto"
- hideKeyboard
- scrollUntilVisible:
    element: ".*Guardar sanidad.*"
- tapOn: ".*Guardar sanidad.*"
- extendedWaitUntil:
    visible: "Sanidad registrada"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Sanidad registrada"
    timeout: 10000
- scrollUntilVisible:
    element: ".*Historial"
- tapOn: ".*Historial"
- extendedWaitUntil:
    visible: '.*Sanidad: Fumigación \| Se aplico producto.*'
    timeout: 20000
- takeScreenshot: sanidad-historial
