# SEMILLA: --jaulas=JX-1 --aves=AV-P:MACHO:JX-1
# SALUD: registrar una enfermedad (Coriza) en un ave; el historial la muestra y el estado pasa a "En tratamiento".
appId: host.exp.exponent
tags:
  - completo
  - migrado
  - salud
---
- runFlow:
    file: ../lib/entrar.yaml
    env:
      PUERTO_METRO: ${PUERTO_METRO}
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      CRIADERO: ${CRIADERO}
- tapOn:
    point: "50%,96%"
- tapOn: ".*AV-P.*"
- scrollUntilVisible:
    element: ".*Salud"
- tapOn: ".*Salud"
- extendedWaitUntil:
    visible: ".*Coriza.*"
    timeout: 20000
- tapOn: ".*Coriza.*"
- scrollUntilVisible:
    element: ".*Guardar diagnóstico.*"
- tapOn: ".*Guardar diagnóstico.*"
# Al guardar, Salud vuelve sola a la ficha del ave y el aviso «Registro guardado» se ve ahora en la ficha (efímero,
# 4 s: no se espera). Se espera la condición real: la ficha con el estado «En tratamiento».
- extendedWaitUntil:
    visible: "Ficha del ave"
    timeout: 30000
- assertNotVisible: ".*Guardar diagnóstico.*"
- extendedWaitUntil:
    visible: ".*En tratamiento.*"
    timeout: 20000
# El historial sanitario sigue en Salud: se vuelve a abrir
- scrollUntilVisible:
    element: ".*Salud"
- tapOn: ".*Salud"
# Salud abre arriba (formulario de diagnóstico); el historial queda bajo el pliegue: se espera la pantalla y se baja
- extendedWaitUntil:
    visible: ".*Guardar diagnóstico.*"
    timeout: 20000
- scrollUntilVisible:
    element: ".*Historial sanitario.*"
    timeout: 40000
- scrollUntilVisible:
    element: ".*Sin medicamento.*"
- assertVisible: ".*Coriza.*"
- takeScreenshot: salud-resultado
