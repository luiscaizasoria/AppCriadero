# SEMILLA: --jaulas=JX-1 --aves=AV-P:MACHO:JX-1
# SALUD: registrar una enfermedad (Coriza) en un ave; el historial la muestra y el estado pasa a "En tratamiento".
appId: host.exp.exponent
tags:
  - completo
  - migrado
  - salud
---
- runFlow:
    file: ../lib/entrar.yaml
    env:
      PUERTO_METRO: ${PUERTO_METRO}
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
      CRIADERO: ${CRIADERO}
- tapOn:
    point: "50%,96%"
- tapOn: ".*AV-P.*"
- scrollUntilVisible:
    element: ".*Salud"
- tapOn: ".*Salud"
- tapOn: ".*Coriza.*"
- scrollUntilVisible:
    element: ".*Guardar diagnóstico.*"
- tapOn: ".*Guardar diagnóstico.*"
- extendedWaitUntil:
    visible: "Registro guardado"
    timeout: 15000
# C5: «Registro guardado» ya es un aviso no bloqueante (sin «Aceptar»); los datos se recargan solos.
- extendedWaitUntil:
    visible: ".*En tratamiento.*"
    timeout: 20000
- scrollUntilVisible:
    element: ".*Historial sanitario.*"
- scrollUntilVisible:
    element: ".*Sin medicamento.*"
- assertVisible: ".*Coriza.*"
- takeScreenshot: salud-resultado
